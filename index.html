<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grupo Peñafiel · Bebidas</title>
  <meta name="description" content="Catálogo de bebidas de Grupo Peñafiel: marcas, sabores, presentaciones y precios.">
  <meta name="theme-color" content="#2b1b14">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;500;600&family=Fraunces:ital,wght@1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/hero.css">
  <link rel="stylesheet" href="css/reloj.css">
  <link rel="stylesheet" href="css/escena.css">
  <link rel="stylesheet" href="css/carrusel.css">
  <link rel="stylesheet" href="css/marcas.css">
  <link rel="stylesheet" href="css/pie.css">
  <link rel="stylesheet" href="css/carga.css">
  <link rel="stylesheet" href="css/productos.css">
  <link rel="stylesheet" href="css/pedido.css">
  <link rel="stylesheet" href="css/anuncio.css">
  <link rel="stylesheet" href="css/lista.css">
</head>
<body>

  <!-- BANNER 1: inicio (video de fondo, placa, bienvenida, saludo y reloj) -->
  <header class="hero" id="inicio">
    <video class="hero__video" id="hero-video" autoplay muted loop playsinline preload="auto"></video>
    <div class="hero__velo"></div>

    <div class="hero__contenido">
      <img class="hero__placa" id="hero-placa" alt="Productos Peñafiel" hidden>
      <h1 class="hero__titulo" data-config="tituloBienvenida"></h1>
      <p class="hero__ruta" data-config="ruta"></p>

      <div class="saludo">
        <p class="saludo__gracias" data-config="mensajeGracias"></p>
        <p class="saludo__hora">
          <span class="saludo__emoji" id="saludo-emoji" aria-hidden="true"></span>
          <span id="saludo-texto"></span>
        </p>
        <!-- Camión que avanza por el día: sol o luna arriba, cielo que cambia -->
        <div class="escena" id="escena" aria-hidden="true">
          <div class="escena__cielo">
            <div class="escena__estrellas" id="escena-estrellas"></div>
            <div class="escena__nubes"><i class="nube nube--1"></i><i class="nube nube--2"></i><i class="nube nube--3"></i></div>
            <div class="escena__cuerpo" id="escena-cuerpo"></div>
            <svg class="escena__lomas" viewBox="0 0 400 100" preserveAspectRatio="none">
              <path class="loma loma--atras" d="M0 62 C60 22 120 32 190 56 S330 22 400 52 L400 100 L0 100 Z"/>
              <path class="loma loma--frente" d="M0 82 C80 52 150 88 230 68 S350 48 400 72 L400 100 L0 100 Z"/>
            </svg>
            <div class="escena__camino"><span class="escena__rayas"></span></div>
            <svg class="escena__camion" id="escena-camion" viewBox="0 0 320 150" aria-hidden="true">
              <defs>
                <linearGradient id="camion-caja" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0" stop-color="#2b86dc"/><stop offset="1" stop-color="#0e4c94"/>
                </linearGradient>
                <linearGradient id="camion-vidrio" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0" stop-color="#dcf3fc"/><stop offset="1" stop-color="#86c3e4"/>
                </linearGradient>
              </defs>
              <ellipse cx="160" cy="140" rx="152" ry="5" fill="rgba(0,0,0,0.3)"/>
              <!-- chasis -->
              <rect x="8" y="104" width="298" height="12" rx="3" fill="#2d2d33"/>
              <!-- caja azul con letrero -->
              <rect x="8" y="16" width="198" height="92" rx="7" fill="url(#camion-caja)"/>
              <rect x="8" y="16" width="198" height="9" rx="4" fill="#e9eef3"/>
              <path d="M8 94 Q52 80 96 94 T184 94 T206 90 V108 H8 Z" fill="rgba(255,255,255,0.16)"/>
              <circle cx="30" cy="44" r="6" fill="rgba(255,255,255,0.3)"/>
              <circle cx="44" cy="34" r="3.5" fill="rgba(255,255,255,0.3)"/>
              <circle cx="176" cy="38" r="5" fill="rgba(255,255,255,0.3)"/>
              <circle cx="190" cy="50" r="3" fill="rgba(255,255,255,0.3)"/>
              <text x="107" y="72" text-anchor="middle" font-size="35" font-weight="800" font-style="italic"
                    fill="#d9291c" stroke="#ffffff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round"
                    font-family="'Bricolage Grotesque','Arial Black',Arial,sans-serif">Peñafiel</text>
              <!-- cabina -->
              <path d="M206 40 H258 Q270 40 277 52 L298 84 Q304 92 304 100 V108 H206 Z" fill="#f6f7f9"/>
              <path d="M215 49 H255 Q261 49 265 56 L279 79 H215 Z" fill="url(#camion-vidrio)"/>
              <path d="M236 50 L226 79" stroke="rgba(255,255,255,0.75)" stroke-width="5"/>
              <path d="M238 82 V106" stroke="#c4c9d0" stroke-width="2"/>
              <rect x="244" y="89" width="12" height="3.5" rx="1.7" fill="#98a0a9"/>
              <path d="M206 98 H304" stroke="#d9291c" stroke-width="4"/>
              <rect x="297" y="84" width="8" height="9" rx="2" fill="#ffe28a"/>
              <rect x="292" y="102" width="18" height="8" rx="3" fill="#3a3a42"/>
              <rect x="201" y="52" width="6" height="16" rx="2" fill="#2d2d33"/>
              <!-- arcos y ruedas -->
              <path d="M48 110 a22 22 0 0 1 44 0 Z" fill="#17171b"/>
              <path d="M232 110 a22 22 0 0 1 44 0 Z" fill="#17171b"/>
              <g class="rueda"><circle cx="70" cy="118" r="19" fill="#1b1b1f"/><circle cx="70" cy="118" r="11" fill="#d3d7dc"/><path d="M70 109v18M61 118h18" stroke="#8b929b" stroke-width="3"/><circle cx="70" cy="118" r="3.5" fill="#555a62"/></g>
              <g class="rueda"><circle cx="254" cy="118" r="19" fill="#1b1b1f"/><circle cx="254" cy="118" r="11" fill="#d3d7dc"/><path d="M254 109v18M245 118h18" stroke="#8b929b" stroke-width="3"/><circle cx="254" cy="118" r="3.5" fill="#555a62"/></g>
            </svg>
          </div>
          <div class="escena__etiquetas">
            <span class="etiqueta" data-fase="manana" style="--p:0.125">Mañana</span>
            <span class="etiqueta" data-fase="tarde"  style="--p:0.40">Tarde</span>
            <span class="etiqueta" data-fase="noche"  style="--p:0.77">Noche</span>
          </div>
        </div>

        <p class="reloj" id="reloj" role="timer" aria-label="Hora actual"></p>
        <p class="saludo__dia" id="fecha-dia"></p>
        <p class="reloj reloj--fecha" id="fecha" aria-label="Fecha de hoy"></p>
      </div>
    </div>
  </header>

  <main>
    <!-- BANNER 2: carrusel de logos + aviso de actualización -->
    <section class="carrusel" id="carrusel" aria-label="Marcas del grupo">
      <div class="carrusel__ventana">
        <div class="carrusel__pista" id="carrusel-pista"></div>
      </div>
      <p class="actualizacion">
        <span class="actualizacion__pildora">
          <span class="actualizacion__punto" aria-hidden="true"></span>
          <span>Última actualización: <strong data-config="ultimaActualizacion"></strong></span>
        </span>
      </p>
    </section>

    <!-- BANNER 3: marcas -->
    <section class="marcas" id="marcas" aria-label="Marcas">
      <h2 class="marcas__titulo" data-config="tituloMarcas"></h2>
      <div class="marcas__rejilla" id="rejilla-marcas"></div>
    </section>

    <p id="estado-datos" class="estado" role="status" hidden></p>
  </main>

  <!-- Vista de productos de la marca elegida -->
  <section class="vista" id="vista-marca" aria-label="Productos de la marca" hidden></section>

  <!-- PIE -->
  <footer class="pie">
    <p class="pie__titulo" data-config="pieTitulo"></p>
    <p class="pie__creador"><span data-config="pieCreador"></span> · <span data-config="ruta"></span></p>
    <p class="pie__hecho"><span data-config="pieHecho"></span> <span class="pie__corazon" aria-hidden="true">❤️</span></p>
    <p class="pie__derechos" data-config="pieDerechos"></p>
  </footer>

  <!-- Lista de productos elegidos (se abre desde la franja de abajo) -->
  <div class="lista" id="lista" hidden></div>

  <!-- Anuncio emergente -->
  <div class="anuncio" id="anuncio" hidden></div>

  <!-- Pantalla de carga al abrir una marca -->
  <div id="pantalla-carga" aria-hidden="true" hidden></div>

  <!-- Franja con los productos elegidos -->
  <div class="barra-pedido" id="barra-pedido" role="status" aria-live="polite" hidden></div>

  <script src="js/config.js"></script>
  <script src="js/agrupar.js"></script>
  <script src="js/datos.js"></script>
  <script src="js/reloj.js"></script>
  <script src="js/escena.js"></script>
  <script src="js/marcas.js"></script>
  <script src="js/carrusel.js"></script>
  <script src="js/pedido.js"></script>
  <script src="js/carga.js"></script>
  <script src="js/productos.js"></script>
  <script src="js/whatsapp.js"></script>
  <script src="js/lista.js"></script>
  <script src="js/barra.js"></script>
  <script src="js/anuncio.js"></script>
  <script src="js/app.js"></script>

  <!-- Aviso de ayuda: si algún archivo no cargó (mala carpeta o nombre), lo dice en pantalla. -->
  <script>
    window.addEventListener("load", function () {
      var falta = [];
      if (!window.CONFIG) falta.push("js/config.js");
      if (!window.Agrupar) falta.push("js/agrupar.js");
      if (!window.Datos) falta.push("js/datos.js");
      if (!window.Reloj) falta.push("js/reloj.js");
      if (!window.Escena) falta.push("js/escena.js");
      if (!window.Marcas) falta.push("js/marcas.js");
      if (!window.Carrusel) falta.push("js/carrusel.js");
      if (!window.Pedido) falta.push("js/pedido.js");
      if (!window.Carga) falta.push("js/carga.js");
      if (!window.Productos) falta.push("js/productos.js");
      if (!window.Whatsapp) falta.push("js/whatsapp.js");
      if (!window.Lista) falta.push("js/lista.js");
      if (!window.Barra) falta.push("js/barra.js");
      if (!window.Anuncio) falta.push("js/anuncio.js");
      if (!window.__appListo) falta.push("js/app.js");
      if (falta.length) {
        var a = document.getElementById("estado-datos");
        a.hidden = false;
        a.className = "estado estado--error";
        a.textContent = "No cargaron estos archivos: " + falta.join(", ") +
          ". Revisa que estén en esas carpetas del repositorio.";
      }
    });
  </script>
</body>
</html>
