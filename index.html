<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Grupo Peñafiel – Catálogo</title>
  <meta name="description" content="Catálogo de refrescos y aguas. Marca los productos que te interesen y mándalos por WhatsApp.">
  <meta name="theme-color" content="#0e1a24">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230e1a24'/%3E%3Ccircle cx='16' cy='17' r='8' fill='%23f2b33d'/%3E%3Ccircle cx='13' cy='14' r='2' fill='%23fff' fill-opacity='.6'/%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Estilos y scripts organizados en sus carpetas correspondientes -->
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

  <header class="cabecera">
    <div class="contenedor">
      <h1 class="nombre-negocio" id="nombre-negocio">Grupo Peñafiel</h1>
      <p class="indicacion">Marca los productos que te interesen y mándalos por WhatsApp.</p>
    </div>
  </header>

  <div class="controles" id="controles">
    <div class="contenedor">
      <label class="buscador">
        <span class="solo-lector">Buscar producto</span>
        <input id="buscador" type="search" placeholder="Buscar producto o marca" autocomplete="off" enterkeyhint="search">
      </label>
    </div>
    <nav id="marcas" class="marcas" aria-label="Filtrar por marca"></nav>
  </div>

  <main class="contenedor" id="catalogo" aria-live="polite">
    <p class="estado">Cargando productos…</p>
  </main>

  <!-- Barra inferior: aparece cuando hay productos en la lista -->
  <div class="barra" id="barra" hidden>
    <p class="barra-texto" id="barra-texto" role="status"></p>
    <button type="button" class="btn-principal" id="btn-ver-lista">Ver mi lista</button>
  </div>

  <!-- Panel con la lista y el envío por WhatsApp -->
  <dialog class="panel" id="panel" aria-labelledby="panel-titulo">
    <div class="panel-cab">
      <h2 id="panel-titulo">Mi lista</h2>
      <button type="button" class="btn-secundario btn-chico" id="btn-cerrar">Cerrar</button>
    </div>
    <p class="panel-vacio" id="panel-vacio" hidden>Todavía no marcas ningún producto. Toca «Me interesa» en los que quieras.</p>
    <ul class="panel-lista" id="panel-lista"></ul>
    <div class="panel-acciones" id="panel-acciones">
      <button type="button" class="btn-secundario" id="btn-vaciar">Vaciar lista</button>
      <a class="btn-principal" id="btn-enviar" href="#" target="_blank" rel="noopener">Enviar por WhatsApp</a>
    </div>
  </dialog>

  <!-- Cada archivo hace una sola cosa. Si uno falla, los demás siguen. -->
  <script src="js/config.js"></script>
  <script src="js/datos.js"></script>
  <script src="js/lista.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
