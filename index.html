<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grupo Peñafiel · Bebidas</title>
  <meta name="description" content="Catálogo de bebidas de Grupo Peñafiel: marcas, sabores, presentaciones y precios.">
  <meta name="theme-color" content="#35a5e0">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="img/icon-192.png">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">

  <link rel="stylesheet" href="css/hero.css?v=32">
  <link rel="stylesheet" href="css/reloj.css?v=32">

  <link rel="stylesheet" href="css/carrusel.css?v=32">
  <link rel="stylesheet" href="css/marcas.css?v=35">
  <link rel="stylesheet" href="css/pie.css?v=31">
  <link rel="stylesheet" href="css/carga.css?v=32">
  <link rel="stylesheet" href="css/productos.css?v=42">
  <link rel="stylesheet" href="css/pedido.css?v=31">
  <link rel="stylesheet" href="css/anuncio.css?v=31">
  <link rel="stylesheet" href="css/lista.css?v=31">

</head>
<body>

  <!-- Bienvenida inicial en teléfono: video del banner y registro local del negocio -->
  <section class="bienvenida-inicial" id="bienvenida-inicial" aria-label="Bienvenida a Grupo Peñafiel">
    <video class="bienvenida-inicial__video" id="bienvenida-video" muted autoplay playsinline preload="metadata" aria-hidden="true"></video>
    <div class="bienvenida-inicial__velo"></div>
    <div class="bienvenida-inicial__contenido">
      <div class="telefono">
        <span class="telefono__boton telefono__boton--arriba" aria-hidden="true"></span>
        <span class="telefono__boton telefono__boton--abajo" aria-hidden="true"></span>
        <div class="telefono__pantalla">
          <div class="telefono__notch"><span></span></div>
          <div class="telefono__marca">🥤 GRUPO PEÑAFIEL</div>
          <div class="telefono__ruta">RUTA 1371</div>
          <div class="telefono__contenido" id="bienvenida-pantalla">
            <div class="telefono__icono">✨</div>
            <h2>¡Qué gusto tenerte aquí!</h2>
            <p>Gracias por visitar nuestra web. Estamos listos para atenderte.</p>
            <div class="telefono__progreso" id="bienvenida-progreso"><span></span></div>
            <small class="telefono__cargando">Preparando tu experiencia...</small>
          </div>
          <button class="telefono__omitir" id="bienvenida-omitir" type="button">Omitir intro</button>
        </div>
      </div>
      <p class="bienvenida-inicial__pie">Tu catálogo de bebidas, siempre cerca. 💧</p>
    </div>
  </section>



  <!-- BANNER 1: inicio (video de fondo, placa, bienvenida, saludo y reloj) -->
  <header class="hero" id="inicio">
    <video class="hero__video" id="hero-video" autoplay muted loop playsinline preload="auto"></video>
    <div class="hero__velo"></div>

    <div class="hero__contenido">
      <img class="hero__placa" id="hero-placa" alt="Productos Peñafiel" hidden>
      <h1 class="hero__titulo hero__bienvenida">
        <span class="bienvenida__texto">TE DAMOS LA BIENVENIDA</span>
        <span class="bienvenida__cliente" id="bienvenida-cliente" hidden>
          <span class="bienvenida__mano" aria-hidden="true">👋</span>
          <strong></strong>
          <span class="bienvenida__mano" aria-hidden="true">👋</span>
        </span>
        <span class="bienvenida__fila" aria-label="Grupo Peñafiel · Ruta 1371">
          <img class="bienvenida__logo" src="img/grupo%20penafiel.png" alt="Grupo Peñafiel">
          <img class="bienvenida__logo" src="img/ruta1371.png" alt="Ruta 1371">
        </span>
      </h1>

      <div class="saludo">
        <p class="saludo__gracias" data-config="mensajeGracias"></p>
        <p class="saludo__hora">
          <span class="saludo__emoji" id="saludo-emoji" aria-hidden="true"></span>
          <span id="saludo-texto"></span>
        </p>
        <!-- Nueva animación de paisaje: reemplaza por completo la escena anterior -->
        <div class="escena" id="escena" aria-hidden="true">
          <section class="scene" id="scene" data-period="day" data-weather="clear">
           <div class="sky">
            <div class="stars" id="stars"></div><div class="shooting-star"></div>
            <div class="sun" id="sun"></div><div class="moon-wrap" id="moonWrap"><div class="moon" id="moon"></div></div>
            <div class="cloud-layer" id="clouds"><i class="cloud c1"></i><i class="cloud c2"></i><i class="cloud c3"></i></div>
            <div class="birds" id="birds" aria-hidden="true"><svg viewBox="0 0 180 76"><g class="bird b1"><path class="wing left" d="M0 0 Q12 -13 25 0"/><path class="wing right" d="M25 0 Q38 -13 50 0"/></g><g class="bird b2"><path class="wing left" d="M0 0 Q10 -11 21 0"/><path class="wing right" d="M21 0 Q32 -11 43 0"/></g><g class="bird b3"><path class="wing left" d="M0 0 Q9 -10 18 0"/><path class="wing right" d="M18 0 Q27 -10 36 0"/></g></svg></div>
            <div class="balloons" aria-hidden="true"><div class="balloon ba1"><i></i><b></b></div><div class="balloon ba2"><i></i><b></b></div><div class="balloon ba3"><i></i><b></b></div></div>
            <div class="plane"><span class="plane-body">✈<span class="plane-lights"><i class="red"></i><i class="white"></i></span></span></div>
           </div>
           <div class="far-hills"></div><div class="near-hills"></div>
           <div class="world" id="world">
            <div class="distant-town">
             <div class="house h1"><i></i><i></i><i></i><i></i></div><div class="house h2"><i></i><i></i><i></i><i></i></div><div class="house h3"><i></i><i></i><i></i><i></i></div><div class="house h4"><i></i><i></i><i></i><i></i></div>
             <div class="cactus ca1"></div><div class="cactus ca2"></div><div class="pole p1"></div><div class="pole p2"></div><div class="pole p3"></div>
            </div>
            <div class="road"><div class="road-lines"></div></div>
           </div>
           <div class="weather-fog"></div><div class="rain-layer"></div><div class="rain-splashes"></div><div class="lightning"></div>
           <div class="headlight-beam"></div>
           <svg class="truck" viewBox="0 0 420 190" role="img" aria-label="Camión Peñafiel">
           <defs><linearGradient id="boxBlue" x2="0" y2="1"><stop stop-color="#318cdd"/><stop offset="1" stop-color="#0d4a8e"/></linearGradient><linearGradient id="glass" x2="1" y2="1"><stop stop-color="#e4f8ff"/><stop offset="1" stop-color="#7cb8dc"/></linearGradient></defs>
           <ellipse cx="210" cy="177" rx="199" ry="8" fill="#0005"/><rect x="10" y="130" width="396" height="16" rx="4" fill="#252a31"/>
           <rect x="10" y="22" width="264" height="111" rx="8" fill="url(#boxBlue)" stroke="#dfe8ef" stroke-width="4"/><path d="M10 111q60-17 120 0t144-3v25H10z" fill="#ffffff20"/>
           <text x="143" y="91" text-anchor="middle" font-size="43" font-weight="900" font-style="italic" fill="#d9291c" stroke="white" stroke-width="5" paint-order="stroke" font-family="Arial">Peñafiel</text>
           <path d="M274 55h83q15 0 23 15l29 48v15H274z" fill="#f4f5f6" stroke="#9aa5af" stroke-width="3"/><path d="M286 64h65q8 0 13 10l17 32h-95z" fill="url(#glass)" stroke="#667d8d" stroke-width="3"/><path d="M326 65l-13 40" stroke="#fff9" stroke-width="5"/><path d="M274 121h133" stroke="#d9291c" stroke-width="5"/>
           <rect x="395" y="112" width="12" height="16" rx="3" fill="#fff1a3" class="front-lamp"/><rect x="5" y="114" width="12" height="22" rx="2" fill="#ef3030" class="rear-lamp"/><rect x="374" y="49" width="10" height="7" rx="2" fill="#ffc52f" class="cab-marker"/>
           <g class="side-markers" fill="#ffc536"><circle cx="23" cy="128" r="4"/><circle cx="263" cy="128" r="4"/><circle cx="286" cy="128" r="4"/></g>
           <g class="wheel"><circle cx="76" cy="148" r="26" fill="#17191d"/><circle cx="76" cy="148" r="15" fill="#bfc7cf"/><circle cx="76" cy="148" r="5" fill="#626a73"/></g><g class="wheel"><circle cx="331" cy="148" r="26" fill="#17191d"/><circle cx="331" cy="148" r="15" fill="#bfc7cf"/><circle cx="331" cy="148" r="5" fill="#626a73"/></g>
           </svg>
           <div class="moon-label" id="moonLabel"></div><div class="scene-label" id="sceneLabel">Día · clima actual</div>
          </section>
        </div>
        <p class="reloj" id="reloj" role="timer" aria-label="Hora actual"></p>
        <p class="saludo__dia" id="fecha-dia"></p>
        <p class="reloj reloj--fecha" id="fecha" aria-label="Fecha de hoy"></p>
      </div>
    </div>
  </header>

  <main>
    <!-- BANNER 2: carrusel de logos + aviso de actualización -->
    <section class="carrusel" id="carrusel" aria-label="Marcas del grupo">
      <div class="carrusel__ventana">
        <div class="carrusel__pista" id="carrusel-pista"></div>
      </div>
      <p class="actualizacion">
        <span class="actualizacion__pildora">
          <span class="actualizacion__punto" aria-hidden="true"></span>
          <span>Última actualización: <strong data-config="ultimaActualizacion"></strong></span>
        </span>
      </p>
      <button class="instalar-app instalar-app--superior" id="instalar-app-superior" type="button" hidden aria-label="Agregar Ruta 1371 a la pantalla principal">
        <span class="instalar-app__icono" aria-hidden="true">📲</span>
        <span class="instalar-app__texto"><strong>Tu catálogo, siempre a tu alcance.</strong><small>Toca aquí y agrégalo a tu pantalla principal.</small></span>
        <span class="instalar-app__flecha" aria-hidden="true">›</span>
      </button>
    </section>

    <!-- BANNER 3: marcas -->
    <section class="marcas" id="marcas" aria-label="Marcas">
      <h2 class="marcas__titulo" data-config="tituloMarcas"></h2>
      <div class="marcas__rejilla" id="rejilla-marcas"></div>
    </section>

    <p id="estado-datos" class="estado" role="status" hidden></p>
  </main>

  <!-- Vista de productos de la marca elegida -->
  <section class="vista" id="vista-marca" aria-label="Productos de la marca" hidden></section>

  <!-- CONTACTO: robot al lado del botón de WhatsApp y botón para salir de la web -->
  <section class="contacto" id="contacto" aria-label="Contacto de ventas">
    <div class="contacto__fila">
      <div class="contacto__robot">
        <span class="contacto__nube" id="contacto-nube">¡Ven, contáctame! 👋</span>
        <img src="img/robot%20red%20bull.webp" alt="Robot de Grupo Peñafiel">
      </div>
      <button class="contacto__boton" id="contacto-boton" type="button" aria-expanded="false">💬 Contacta a tu asesor de ventas</button>
    </div>
    <button class="instalar-app" id="instalar-app" type="button" hidden aria-label="Agregar Ruta 1371 a la pantalla principal">
      <span class="instalar-app__icono" aria-hidden="true">⌂</span>
      <span class="instalar-app__texto"><strong>Tu catálogo, siempre a tu alcance.</strong><small>Toca aquí y agrégalo a tu pantalla principal.</small></span>
      <span class="instalar-app__flecha" aria-hidden="true">›</span>
    </button>
    <p class="instalar-ayuda" id="instalar-ayuda" hidden></p>
    <button class="instalar-confirmar" id="instalar-confirmar" type="button" hidden>Listo, ya lo agregué ✓</button>
    <button class="contacto__salir" id="contacto-salir" type="button">🚪 Salir de la web</button>
  </section>

  <!-- PIE -->
  <footer class="pie">
    <p class="pie__titulo" data-config="pieTitulo"></p>
    <p class="pie__creador"><span data-config="pieCreador"></span> · <span data-config="ruta"></span></p>
    <p class="pie__hecho"><span data-config="pieHecho"></span> <span class="pie__corazon" aria-hidden="true">❤️</span></p>
    <p class="pie__derechos" data-config="pieDerechos"></p>
  </footer>

  <!-- Lista de productos elegidos (se abre desde la franja de abajo) -->
  <div class="lista" id="lista" hidden></div>

  <!-- Anuncio emergente -->
  <div class="anuncio" id="anuncio" hidden></div>

  <!-- Pantalla de carga al abrir una marca -->
  <div id="pantalla-carga" aria-hidden="true" hidden></div>

  <!-- Franja con los productos elegidos -->
  <div class="barra-pedido" id="barra-pedido" role="status" aria-live="polite" hidden></div>

  <script src="js/config.js?v=35"></script>
  <script src="js/agrupar.js?v=34"></script>
  <script src="js/datos.js?v=32"></script>
  <script src="js/reloj.js?v=31"></script>
  <script src="js/escena.js?v=36"></script>
  <script src="js/marcas.js?v=33"></script>
  <script src="js/carrusel.js?v=32"></script>
  <script src="js/pedido.js?v=31"></script>
  <script src="js/carga.js?v=33"></script>
  <script src="js/productos.js?v=43"></script>
  <script src="js/whatsapp.js?v=32"></script>
  <script src="js/lista.js?v=31"></script>
  <script src="js/barra.js?v=31"></script>
  <script src="js/anuncio.js?v=34"></script>
  <script src="js/app.js?v=32"></script>

  <!-- Aviso de ayuda: si algún archivo no cargó (mala carpeta o nombre), lo dice en pantalla. -->
  <script>
    window.addEventListener("load", function () {
      var falta = [];
      if (!window.CONFIG) falta.push("js/config.js");
      if (!window.Agrupar) falta.push("js/agrupar.js");
      if (!window.Datos) falta.push("js/datos.js");
      if (!window.Reloj) falta.push("js/reloj.js");
      if (!window.Escena) falta.push("js/escena.js");
      if (!window.Marcas) falta.push("js/marcas.js");
      if (!window.Carrusel) falta.push("js/carrusel.js");
      if (!window.Pedido) falta.push("js/pedido.js");
      if (!window.Carga) falta.push("js/carga.js");
      if (!window.Productos) falta.push("js/productos.js");
      if (!window.Whatsapp) falta.push("js/whatsapp.js");
      if (!window.Lista) falta.push("js/lista.js");
      if (!window.Barra) falta.push("js/barra.js");
      if (!window.Anuncio) falta.push("js/anuncio.js");
      if (!window.__appListo) falta.push("js/app.js");
      if (falta.length) {
        var a = document.getElementById("estado-datos");
        a.hidden = false;
        a.className = "estado estado--error";
        a.textContent = "No cargaron estos archivos: " + falta.join(", ") +
          ". Revisa que estén en esas carpetas del repositorio.";
      }
    });
  </script>

  <!-- Extras de la web principal -->
  <script src="js/recorte.js?v=31" defer></script>
  <script src="js/burbujas.js?v=35" defer></script>
  <script src="js/bienvenida.js?v=4" defer></script>
  <script src="js/pwa.js?v=38" defer></script>
  <script src="js/robot.js?v=35" defer></script>
  <script src="js/botones.js?v=31" defer></script>
  <script src="js/salida.js?v=32" defer></script>
  <script src="js/tono.js?v=31" defer></script>
  <script src="js/colores.js?v=31" defer></script>
</body>
</html>
